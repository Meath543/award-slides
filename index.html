<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<title>富謙通訊處 | 萬聖狂歡 頒獎慶典</title>
<style>
:root { --main:#ff7518; --accent:#c77dff; --bg:#1a0b2e; --panel-bg:rgba(26,11,46,0.86); --text:#fff; }
body, html { margin:0; padding:0; height:100%; overflow:hidden; background:var(--bg); color:var(--text); font-family:'Noto Sans TC','Microsoft JhengHei',sans-serif; user-select:none; }
#slideshow { width:100%; height:100%; position:relative; cursor:pointer; }
.slide { width:100%; height:100%; position:absolute; top:0; left:0; display:flex; justify-content:center; align-items:center; opacity:0; visibility:hidden; transition:0.8s ease-in-out; background:radial-gradient(circle at 80% 15%, #3c1a5b 0%, #1a0b2e 60%, #0d0518 100%); background-size:cover; background-position:center; }
.slide.active { opacity:1; visibility:visible; }

.title-content { text-align:center; z-index:20; padding:60px 100px; background:var(--panel-bg); border-radius:20px; box-shadow:0 20px 50px rgba(0,0,0,0.5); border:4px solid var(--accent); backdrop-filter:blur(10px); }
.title-content h1 { font-size:5rem; margin:0; color:var(--text); text-shadow:2px 2px 0 var(--main); }
.title-content h1.end-text { font-size:3.6rem; line-height:1.5; }
.title-content h2 { font-size:3rem; color:var(--main); margin:20px 0; }
.t-icon { font-size:4.5rem; margin-bottom:10px; animation:bob 2.4s ease-in-out infinite; }
@keyframes bob { 0%,100% { transform:translateY(0); } 50% { transform:translateY(-12px); } }
.badge { display:inline-block; background:var(--main); color:#fff; padding:15px 40px; font-size:2.2rem; border-radius:50px; font-weight:bold; margin-top:20px; }

.winner-panel { display:flex; width:92vw; max-width:1750px; height:84vh; background:var(--panel-bg); border-radius:30px; align-items:center; gap:3vw; padding:2vh 3vw; box-sizing:border-box; border:4px solid var(--main); box-shadow:0 30px 60px rgba(0,0,0,0.5); backdrop-filter:blur(10px); z-index:20; }
.winner-info { flex:1; min-width:0; }
.cat-tag { font-size:clamp(1.2rem,2vw,2rem); background:var(--main); color:#fff; padding:5px 22px; border-radius:50px; display:inline-block; margin-bottom:15px; font-weight:bold; }
.rank { font-size:clamp(2.5rem,4.2vw,5rem); color:var(--accent); margin:0; font-weight:900; text-shadow:1px 1px 0 rgba(0,0,0,0.25); }
.name { font-size:clamp(3.5rem,6.5vw,8rem); color:var(--text); margin:1vh 0 3vh; font-weight:bold; line-height:1.1; }
.score { font-size:clamp(1.6rem,2.8vw,3.2rem); background:var(--bg); color:var(--text); border:3px solid var(--accent); display:inline-block; padding:12px 30px; border-radius:50px; font-weight:bold; }

/* 得獎者照片：佔滿面板高度，帶光暈與進場放大 */
.winner-photo { position:relative; height:78vh; aspect-ratio:3/4; max-width:48vw; flex-shrink:0; display:flex; align-items:center; justify-content:center; }
.winner-photo::before { content:''; position:absolute; inset:-6%; border-radius:50%; background:radial-gradient(circle, var(--accent) 0%, transparent 65%); opacity:0.55; filter:blur(20px); animation:glow 2.5s ease-in-out infinite alternate; }
.winner-photo img { position:relative; width:100%; height:100%; object-fit:cover; object-position:center top; border:12px solid #fff; border-radius:20px; box-sizing:border-box; box-shadow:0 0 0 5px var(--accent), 0 25px 60px rgba(0,0,0,0.55); transform:rotate(2deg); }
.slide.active .winner-photo img { animation:photoIn 0.9s cubic-bezier(.2,1.4,.4,1) both; }
@keyframes photoIn { from { transform:scale(0.6) rotate(-8deg); opacity:0; } to { transform:scale(1) rotate(2deg); opacity:1; } }
@keyframes glow { from { opacity:0.35; transform:scale(0.95); } to { opacity:0.75; transform:scale(1.05); } }

.is-first { border-color:var(--accent); animation:pulse 2s infinite alternate; }
.is-first .winner-photo img { box-shadow:0 0 0 6px var(--accent), 0 0 50px var(--accent), 0 25px 60px rgba(0,0,0,0.55); }
.is-first .winner-photo::after { content:'👑'; position:absolute; top:-7%; left:50%; transform:translateX(-50%) rotate(-8deg); font-size:clamp(3rem,6vh,5rem); filter:drop-shadow(0 4px 6px rgba(0,0,0,0.4)); z-index:2; }
@keyframes pulse { from { box-shadow:0 0 20px var(--main); } to { box-shadow:0 0 60px var(--accent); } }

#music-btn { position:fixed; right:24px; bottom:24px; z-index:50; display:flex; align-items:center; gap:8px; padding:10px 18px; border:none; border-radius:40px; background:rgba(0,0,0,0.6); color:#fff; font-size:1.1rem; font-weight:bold; cursor:pointer; font-family:inherit; animation:hint 1.6s ease-in-out infinite; }
#music-btn .mi { font-size:1.5rem; }
#music-btn.compact { padding:8px 10px; opacity:0.35; animation:none; }
#music-btn.compact:hover { opacity:0.9; }
#music-btn.compact .mt { display:none; }
@keyframes hint { 0%,100% { transform:scale(1); } 50% { transform:scale(1.06); } }
#fx { position:fixed; inset:0; pointer-events:none; z-index:10; overflow:hidden; }
#fx span { position:absolute; opacity:0.75; animation-timing-function:linear; animation-iteration-count:infinite; }
#fx .fall { top:-60px; animation-name:fall; }
#fx .rise { bottom:-60px; animation-name:rise; }
@keyframes fall { from { transform:translateY(0) rotate(0deg); } to { transform:translateY(115vh) rotate(360deg); } }
@keyframes rise { from { transform:translateY(0) rotate(0deg); } to { transform:translateY(-115vh) rotate(-30deg); } }
</style>
</head>
<body>
<audio id="bgm" src="bgm.mp3" loop preload="auto"></audio><button id="music-btn"><span class="mi">🔇</span><span class="mt"></span></button>
<div id="fx"></div>
<div id="slideshow"></div>
<script>
(function slideRuntime(D) {
        const T = D.theme;
        const NO_PHOTO = 'https://placehold.co/400x600/333/fff?text=NO+PHOTO';
        const fmt = v => /^\d+$/.test(v) ? Number(v).toLocaleString('en-US') : v;
        const photoOf = n => D.photos[n] || NO_PHOTO;

        let h = '';
        // 首頁
        h += `<div class="slide active"><div class="title-content"><div class="t-icon">${T.icon}</div><h1>富謙通訊處</h1><h2>${D.year}年 ${D.month}月月會 ｜ 第${D.comp}工競賽</h2><div class="badge">${T.badge}</div></div></div>`;

        // MDRT
        D.mdrt.forEach(name => {
            h += `<div class="slide"><div class="winner-panel is-first"><div class="winner-info"><span class="cat-tag">👑 MDRT</span><h2 class="rank">百萬圓桌達成</h2><h1 class="name">${name}</h1><div class="score">🎉 恭喜達成 MDRT</div></div><div class="winner-photo"><img src="${photoOf(name)}"></div></div></div>`;
        });

        // 各獎項（由第三名往第一名揭曉）
        ['individual', 'supervisor', 'casecount'].forEach(key => {
            const list = D.awards[key];
            if (!list || !list.length) return;
            const L = T.labels[key];
            h += `<div class="slide"><div class="title-content"><div class="t-icon">${T.icon}</div><h1>${L.cat}<br><span style="color:var(--accent); font-size:0.8em;">${L.sub}</span></h1><h2>${L.desc}</h2></div></div>`;
            list.slice().sort((a, b) => b.rank - a.rank).forEach(w => {
                const rStr = ['', '🥇 第一名', '🥈 第二名', '🥉 第三名'][w.rank];
                const labelStr = key === 'casecount' ? '總件數' : 'FYC';
                h += `<div class="slide"><div class="winner-panel ${w.rank === 1 ? 'is-first' : ''}"><div class="winner-info"><span class="cat-tag">${L.cat}</span><h2 class="rank">${rStr}</h2><h1 class="name">${w.name}</h1><div class="score">${labelStr}：${fmt(w.val)}</div></div><div class="winner-photo"><img src="${photoOf(w.name)}"></div></div></div>`;
            });
        });

        // 結尾
        h += `<div class="slide"><div class="title-content"><div class="t-icon">${T.icon}</div><h1 class="end-text">${T.endText}</h1></div></div>`;
        document.getElementById('slideshow').innerHTML = h;

        // 飄動裝飾
        const fx = document.getElementById('fx');
        const em = T.fx.emojis;
        for (let i = 0; i < 22; i++) {
            const s = document.createElement('span');
            s.textContent = em[i % em.length];
            s.className = T.fx.dir === 'up' ? 'rise' : 'fall';
            s.style.left = (Math.random() * 100) + 'vw';
            s.style.fontSize = (18 + Math.random() * 26) + 'px';
            const dur = 9 + Math.random() * 9;
            s.style.animationDuration = dur + 's';
            s.style.animationDelay = (-Math.random() * dur) + 's';
            fx.appendChild(s);
        }

        // 播放邏輯
        let cur = 0;
        const slides = document.querySelectorAll('.slide');

        // ---- 背景音樂：瀏覽器規定要「點擊或按鍵」後才能出聲 ----
        const audio = document.getElementById('bgm');
        const mbtn = document.getElementById('music-btn');
        let playing = false, muted = false, broken = false, startedAt = 0;
        function setBtn(icon, text) {
            if (!mbtn) return;
            mbtn.querySelector('.mi').textContent = icon;
            mbtn.querySelector('.mt').textContent = text;
            mbtn.classList.toggle('compact', playing && !broken);
        }
        function tryPlay() {
            if (!audio || playing || muted || broken) return;
            audio.volume = 0.6;
            startedAt = Date.now();
            audio.play().then(() => { playing = true; setBtn('🔊', ''); })
                .catch(() => setBtn('🔇', '點一下畫面播放音樂'));
        }
        if (audio) {
            setBtn('🔇', '點一下畫面播放音樂');
            audio.addEventListener('error', () => {
                broken = true;
                setBtn('⚠️', `找不到音樂檔「${D.bgm}」`);
            });
            // 任何點擊或按鍵都會嘗試啟動音樂（滾輪不算，瀏覽器不承認）
            document.addEventListener('pointerdown', tryPlay, true);
            document.addEventListener('keydown', e => {
                if (e.key === 'm' || e.key === 'M') { toggleMute(); return; }
                tryPlay();
            }, true);
            tryPlay();   // 若瀏覽器允許，直接自動播放
        }
        function toggleMute() {
            if (!audio || broken) return;
            if (Date.now() - startedAt < 600) return;   // 這次點擊剛啟動音樂，不要馬上又關掉
            if (playing) { audio.pause(); playing = false; muted = true; setBtn('🔇', '已靜音（按 M 或點此播放）'); }
            else { muted = false; tryPlay(); }
        }
        if (mbtn) mbtn.addEventListener('click', e => { e.stopPropagation(); toggleMute(); });

        function go(n) {
            if (n < 0) n = slides.length - 1;
            if (n >= slides.length) n = 0;
            slides.forEach((s, i) => s.classList.toggle('active', i === n));
            cur = n;
        }
        document.getElementById('slideshow').addEventListener('click', () => go(cur + 1));
        document.addEventListener('keydown', e => {
            if (['ArrowRight', 'ArrowDown', ' ', 'PageDown', 'Enter'].includes(e.key)) go(cur + 1);
            if (['ArrowLeft', 'ArrowUp', 'PageUp'].includes(e.key)) go(cur - 1);
        });
        let lock = false;
        document.addEventListener('wheel', e => {
            if (lock) return; lock = true; setTimeout(() => lock = false, 600);
            if (e.deltaY > 0) go(cur + 1); else if (e.deltaY < 0) go(cur - 1);
        });
    })({"awards":{"individual":[{"rank":1,"name":"鶴田一夫","val":"56393"},{"rank":2,"name":"劉晏頤","val":"33288"},{"rank":3,"name":"鄭慧娟","val":"33129"}],"supervisor":[{"rank":1,"name":"譚宸泰","val":"129839"},{"rank":2,"name":"吳茳蕙","val":"124867"},{"rank":3,"name":"陳伯源","val":"89391"}],"casecount":[{"rank":1,"name":"鶴田一夫","val":"3"},{"rank":2,"name":"劉晏頤","val":"3"},{"rank":3,"name":"鄭慧娟","val":"2"}]},"mdrt":["鄭雅婷","吳沛綺","張珮慈"],"bgm":"bgm.mp3","photos":{"吳沛綺":"https://i.postimg.cc/j24t8VqS/S-1048581-0.jpg","鶴田一夫":"https://i.postimg.cc/63rChhSf/Snipaste-2025-09-14-23-32-19.png","劉蓉燕":"https://i.postimg.cc/c4srpWgW/Snipaste-2025-09-14-23-15-11.png","吳茳蕙":"https://i.postimg.cc/SNRv1Fx1/S-1048580-0.jpg","陳伯源":"https://i.postimg.cc/NFtkQGjy/S-100540426.jpg","陳世雄":"https://i.postimg.cc/W3z3QsVZ/chen-shi-xiong1.png","張珮慈":"https://i.postimg.cc/pLbXPB4v/4-B12-CCC1-378-F-4-E0-E-BA4-B-3-E79-DFD973-CE.jpg","譚宸泰":"https://i.postimg.cc/KjtcTk3w/184385-EE-53-B5-480-F-949-C-AC97-E03-B4284.jpg","鄭雅婷":"https://i.postimg.cc/yxGhDG9v/C3-CC6494-81-AC-4929-A723-0-CA884-BB99-F5.jpg","陳冠宏":"https://i.postimg.cc/MpwFYcgx/2949-E309-9-F81-4-DDA-819-F-E0-CFD7897551.jpg","賴炎新":"https://i.postimg.cc/g0SHwM98/300588.jpg","張寶方":"https://i.postimg.cc/YCXW8hds/Snipaste-2025-10-18-02-17-49.png","鄭慧娟":"https://i.postimg.cc/HkXfwGRP/image.png","老菲":"https://i.postimg.cc/qMPghB6y/PXL-20260529-004732296.jpg","劉晏頤":"https://i.postimg.cc/2y7gfFbr/957543F8-217C-47C3-94CF-387DCFC3BEB0.jpg"},"year":"2026","month":"十","comp":"九","theme":{"name":"🎃 萬聖狂歡（南瓜暗夜風）","months":[10],"icon":"🎃","title":"萬聖狂歡 頒獎慶典","vars":{"main":"#ff7518","accent":"#c77dff","bg":"#1a0b2e","panel":"rgba(26,11,46,0.86)","text":"#fff"},"bg":"radial-gradient(circle at 80% 15%, #3c1a5b 0%, #1a0b2e 60%, #0d0518 100%)","badge":"🎃 萬聖狂歡 · 魔力全開 🎃","labels":{"individual":{"cat":"個人組","sub":"南瓜霸主","desc":"魔力全開 · 個人巔峰"},"supervisor":{"cat":"主管組","sub":"暗夜領主","desc":"夜行領航 · 統御全場"},"casecount":{"cat":"件數獎","sub":"糖果滿袋","desc":"不給糖就搗蛋 · 件件到手"}},"endText":"不給業績就搗蛋！\u003cbr>把每一次挑戰，\u003cbr>都變成最甜的糖果！","fx":{"emojis":["🎃","🦇","👻","🍬"],"dir":"up"}}});
</script>
</body>
</html>
